name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  # 0.9.0：严格校验（任何一步失败即失败）——类型、lint、三套单测、评测（回放）、VFS 自检、密钥扫描、逐项验收报告
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # 0.11.0：run 39938123873 在这一步卡住 8 分钟以上（apt 锁 / man-db 触发器，被手动取消）。
      # 改为：非交互 + 关闭 man-db 触发器 + 不装推荐包 + 每条命令 timeout + 步骤 timeout-minutes + continue-on-error；
      # 装不上时 AIGC 外部校验自动跳过，accept:v10 对应项记“部分”，不阻断。
      - name: external tools for AIGC checks (exiftool / ffprobe, distro packages, bounded)
        timeout-minutes: 6
        continue-on-error: true
        env: { DEBIAN_FRONTEND: noninteractive }
        run: |
          sudo rm -f /var/lib/man-db/auto-update || true
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections || true
          ok=1
          timeout 150 sudo -E apt-get -o DPkg::Lock::Timeout=45 -o Acquire::Retries=2 update -qq || ok=0
          [ "$ok" = 1 ] && { timeout 200 sudo -E apt-get -o DPkg::Lock::Timeout=45 install -y -qq --no-install-recommends libimage-exiftool-perl ffmpeg >/tmp/apt.log 2>&1 || ok=0; }
          command -v exiftool && exiftool -ver || echo "exiftool 未装上"
          command -v ffprobe && ffprobe -version | head -1 || echo "ffprobe 未装上"
          [ "$ok" = 1 ] || { tail -20 /tmp/apt.log 2>/dev/null; echo "外部工具未装全：AIGC 外部校验将跳过，accept:v10 记为部分"; }
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npx eslint .
      - name: vfs defaults up to date
        run: node scripts/gen-vfs-defaults.mjs --check
      - name: unit tests (shared / server / web)
        run: |
          mkdir -p out
          (cd shared && npx vitest run --reporter=default --reporter=json --outputFile=../out/vitest-shared.json)
          (cd server && npx vitest run --reporter=default --reporter=json --outputFile=../out/vitest-server.json)
          (cd web && npx vitest run --reporter=default --reporter=json --outputFile=../out/vitest-web.json)
      - name: eval (golden G01–G28 + behavior BQ-01–BQ-32, replay)
        run: |
          (cd shared && npx vitest run ../evals --reporter=default --reporter=json --outputFile=../out/vitest-evals.json)
          node scripts/eval-report.mjs
      - name: vfs doctor
        run: node scripts/vfs-doctor.mjs
      - name: secret scan (tracked files, git history, build output)
        run: |
          git ls-files | node scripts/scan-secrets.mjs --stdin
          git log -p --all -- . ':(exclude)*.png' ':(exclude)*.jpg' ':(exclude)package-lock.json' | grep '^+' > /tmp/history.txt || true
          node scripts/scan-secrets.mjs /tmp/history.txt
          npm run build
          node scripts/scan-secrets.mjs web/dist shared/dist server/dist
      - name: accept:v9 (C1–C56)
        if: always()
        run: node scripts/accept-v9.mjs
      - name: accept:v10 (ROADMAP 0.10)
        if: always()
        run: node scripts/accept-v10.mjs --strict
      - name: accept:v11 (ROADMAP 0.11)
        if: always()
        run: node scripts/accept-v11.mjs --strict
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-0.11.0
          path: |
            out/accept-v9.json
            out/accept-v9.md
            out/accept-v10.json
            out/accept-v10.md
            out/accept-v11.json
            out/accept-v11.md
            out/search-v11.json
            evals/real/
            out/aigc-v10/
            out/eval-report-0.9.0.json
            out/eval-report-0.9.0.md
            out/vfs-doctor-report.json
            out/vitest-*.json
          if-no-files-found: warn
  # 旧的一键检查（含覆盖率与依赖审计），保留为参考，不阻断
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: bash scripts/ci.sh
        continue-on-error: true
  # APK：用 runner 自带的 Android SDK（ANDROID_HOME / ANDROID_SDK_ROOT），不使用第三方 android-actions/setup-android；
  # 产物与构建日志推到 apk-build 分支（取回方式：git clone --branch apk-build）。
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: build apk
        shell: bash
        run: set -o pipefail; echo "ANDROID_HOME=${ANDROID_HOME:-unset}"; bash scripts/build-android-debug.sh 2>&1 | tee /tmp/build.log
      - name: publish apk and log to apk-build branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out && cp /tmp/build.log /tmp/out/ || true
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b apk-build
          git config user.email ci@local && git config user.name ci
          git add -A && git commit -qm "apk build ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
      - if: success()
        uses: actions/upload-artifact@v4
        with: { name: app-debug.apk, path: mobile/android/app/build/outputs/apk/debug/app-debug.apk }
